<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance de Campanhas — Mota e Silva, Mignoni, Alcanfôr Advogados</title>
<style>
  :root, .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --seq-100: #cde2fb;
    --seq-400: #3987e5;
    --seq-450: #2a78d6;
    --good-text: #006300;
    --status-good: #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical: #d03b3b;
  }
  :root[data-theme="dark"], [data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --grid:           #2c2c2a;
    --axis:           #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --seq-100: #184f95;
    --seq-400: #3987e5;
    --seq-450: #3987e5;
    --good-text: #0ca30c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { padding: 20px; }
  .wrap { max-width: 1240px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header.top {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 18px;
  }
  header.top h1 { font-size: 22px; margin: 0 0 2px; font-weight: 650; }
  header.top .sub { color: var(--text-secondary); font-size: 13px; }
  .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-secondary); background: var(--surface-1);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--status-good); }
  .pill.demo .dot { background: var(--status-warning); }
  .pill.live .dot { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  button {
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    border-radius: 8px; padding: 7px 12px;
  }
  button:hover { border-color: var(--axis); }
  button.icon-btn { padding: 7px 9px; }

  /* ---------- Filters ---------- */
  .filters {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 18px;
  }
  .filters .group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filters label.chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 10px 5px 8px; cursor: pointer; user-select: none;
  }
  .filters label.chip input { accent-color: var(--series-1); }
  .filters label.chip .swatch { width: 9px; height: 9px; border-radius: 2px; }
  select {
    font-family: inherit; font-size: 13px; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; background: var(--surface-1); color: var(--text-primary);
  }
  .filters .spacer { flex: 1; }
  input[type="search"] {
    font-family: inherit; font-size: 13px; border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; background: var(--surface-1); color: var(--text-primary);
    min-width: 180px;
  }

  /* ---------- KPI row ---------- */
  .kpi-row {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 20px;
  }
  @media (max-width: 980px) { .kpi-row { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
  .stat-tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 14px 12px;
  }
  .stat-tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .stat-tile .value { font-size: 22px; font-weight: 650; line-height: 1.1; }
  .stat-tile .delta { display: flex; align-items: center; gap: 4px; font-size: 12px; margin-top: 6px; font-weight: 600; }
  .stat-tile .delta.up { color: var(--good-text); }
  .stat-tile .delta.down { color: var(--status-critical); }
  .stat-tile .delta .vs { color: var(--text-muted); font-weight: 500; margin-left: 2px; }
  .stat-tile svg.spark { display: block; margin-top: 8px; }

  /* ---------- Chart cards ---------- */
  .charts-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-bottom: 18px; }
  @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px;
  }
  .card .card-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px;
  }
  .card .card-head h2 { font-size: 14px; margin: 0; font-weight: 650; }
  .card .card-head .actions { display: flex; gap: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-secondary); margin: 6px 0 4px; }
  .legend .item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .legend .item.off { opacity: .35; }
  .legend .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .chart-svg-wrap { position: relative; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--text-primary); color: var(--page);
    font-size: 11px; padding: 6px 9px; border-radius: 6px; line-height: 1.5; white-space: nowrap;
    transform: translate(-50%, -110%); opacity: 0; transition: opacity .1s;
    box-shadow: 0 4px 14px rgba(0,0,0,.2); z-index: 5;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .t-row { display: flex; align-items: center; gap: 6px; }
  .tooltip .t-dot { width: 7px; height: 7px; border-radius: 50%; }
  table.data-table { display: none; width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
  table.data-table.show { display: table; }
  table.data-table.show ~ svg { display: none; }
  .chart-svg-wrap.table-mode svg { display: none; }
  table.data-table th, table.data-table td {
    text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid);
    font-variant-numeric: tabular-nums;
  }
  table.data-table th { color: var(--text-secondary); font-weight: 600; }

  /* ---------- Main table ---------- */
  .table-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .table-card h2 { font-size: 14px; margin: 0 0 10px; font-weight: 650; }
  .table-scroll { overflow-x: auto; }
  table.main-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
  table.main-table th {
    position: sticky; top: 0; text-align: left; padding: 8px 10px; font-size: 11.5px;
    color: var(--text-secondary); border-bottom: 1px solid var(--axis); cursor: pointer; white-space: nowrap;
    background: var(--surface-1);
  }
  table.main-table th:hover { color: var(--text-primary); }
  table.main-table th.sorted::after { content: attr(data-arrow); margin-left: 4px; color: var(--text-muted); }
  table.main-table td { padding: 8px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.main-table td.num { text-align: right; }
  .chan-tag { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: normal; }
  .chan-tag .swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .roas-flag { font-size: 11px; margin-left: 6px; font-weight: 700; }
  .roas-flag.good { color: var(--good-text); }
  .roas-flag.bad { color: var(--status-critical); }

  footer.note {
    margin-top: 20px; font-size: 12px; color: var(--text-muted); line-height: 1.6;
    border-top: 1px solid var(--border); padding-top: 14px;
  }
  footer.note code {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
  }
  .progress-track { height: 3px; width: 100%; background: var(--grid); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; background: var(--series-1); width: 0%; transition: width 1s linear; }
</style>
</head>
<body>
<div class="wrap viz-root">

  <header class="top">
    <div>
      <h1>Performance de Campanhas — Meta Ads</h1>
      <div class="sub" id="subtitle">Visão consolidada das campanhas ativas no Meta Ads</div>
    </div>
    <div class="status-row">
      <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">Carregando…</span></span>
      <span class="pill" id="contractsPill"><span class="dot"></span><span id="contractsText">Contratos: —</span></span>
      <span class="pill"><span id="updatedText">—</span></span>
      <button class="icon-btn" id="refreshBtn" title="Atualizar agora">⟳ Atualizar</button>
      <button class="icon-btn" id="themeBtn" title="Alternar tema">◐ Tema</button>
    </div>
  </header>

  <div class="filters">
    <div class="group" id="campaignChips"></div>
    <select id="rangeSelect">
      <option value="7">Últimos 7 dias</option>
      <option value="14" selected>Últimos 14 dias</option>
      <option value="30">Últimos 30 dias</option>
    </select>
    <div class="spacer"></div>
    <input type="search" id="searchInput" placeholder="Buscar campanha…">
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="charts-row">
    <div class="card">
      <div class="card-head">
        <h2>Investimento diário por campanha</h2>
        <div class="actions"><button class="icon-btn" data-toggle-table="lineChart">Ver tabela</button></div>
      </div>
      <div class="legend" id="lineLegend"></div>
      <div class="chart-svg-wrap" id="lineChartWrap">
        <svg id="lineChart" viewBox="0 0 640 260" preserveAspectRatio="none" style="width:100%;height:260px;"></svg>
        <div class="tooltip" id="lineTooltip"></div>
        <table class="data-table" id="lineTable"></table>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>CPL por campanha</h2>
        <div class="actions"><button class="icon-btn" data-toggle-table="barChart">Ver tabela</button></div>
      </div>
      <div class="chart-svg-wrap" id="barChartWrap">
        <svg id="barChart" viewBox="0 0 400 260" preserveAspectRatio="none" style="width:100%;height:260px;"></svg>
        <div class="tooltip" id="barTooltip"></div>
        <table class="data-table" id="barTable"></table>
      </div>
    </div>
  </div>

  <div class="table-card">
    <h2>Campanhas — detalhamento</h2>
    <div class="table-scroll">
      <table class="main-table" id="mainTable">
        <thead>
          <tr>
            <th data-key="campaign">Campanha</th>
            <th data-key="status">Status</th>
            <th data-key="spend" class="num">Investido</th>
            <th data-key="leads" class="num">Leads</th>
            <th data-key="cpl" class="num">CPL</th>
          </tr>
        </thead>
        <tbody id="mainTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</div>

<script>
(function () {
  "use strict";

  // ============================================================
  // CONFIG — troque pelas URLs das planilhas publicadas em CSV assim
  // que as fontes de dados ao vivo estiverem conectadas.
  // Ex.: "https://docs.google.com/spreadsheets/d/e/XXXX/pub?output=csv"
  //
  // FONTE 1 — Meta Ads, alimentada automaticamente pelo Windsor.ai.
  // Colunas esperadas: date,channel,campaign,status,spend,leads
  // - status: "Ativa" ou "Pausada" (filtre a consulta de origem por
  //   campaign status = ACTIVE para só trazer campanhas rodando)
  // - leads: ação "lead" do Meta (CPL = spend/leads)
  //
  // FONTE 2 — Contratos fechados, preenchida manualmente (o Meta Ads não
  // sabe quando um lead vira cliente). Uma linha por contrato fechado.
  // Colunas esperadas: date,valor  (valor é opcional; se vazio, usa TICKET_MEDIO)
  // ============================================================
  const DATA_SOURCE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcrvOdEDNtOW0ECIr6-ObLXw-lxue6BQLCMwds8I7TPcOzjjAY60KQPBFVDRFG5dGxK9LUJejDrtu_/pub?gid=743787169&single=true&output=csv";
  const CONTRACTS_SOURCE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcrvOdEDNtOW0ECIr6-ObLXw-lxue6BQLCMwds8I7TPcOzjjAY60KQPBFVDRFG5dGxK9LUJejDrtu_/pub?gid=0&single=true&output=csv";
  const TICKET_MEDIO = 6000; // usado quando a linha de contrato não tem "valor"
  const REFRESH_MS = 5 * 60 * 1000; // 5 minutos

  // Só Meta Ads e só campanhas ativas no primeiro momento. Para adicionar
  // outro canal depois, acrescente campanhas aqui com um "channel" diferente
  // e um novo slot de cor (--series-4, --series-5...).
  const CAMPAIGN_DEFS = [
    { channel: "Meta Ads", name: "Feed - Prospecção",     color: "--series-1", status: "Ativa", dailySpend: [1100,1500], cpc: [0.55,0.75], leadRate: [0.08,0.12] },
    { channel: "Meta Ads", name: "Stories - Remarketing", color: "--series-2", status: "Ativa", dailySpend: [500,700],   cpc: [0.45,0.65], leadRate: [0.12,0.16] },
    { channel: "Meta Ads", name: "Reels - Conversão",     color: "--series-3", status: "Ativa", dailySpend: [750,950],  cpc: [0.5,0.7],   leadRate: [0.10,0.14] },
  ];

  const fmtInt = n => Math.round(n).toLocaleString("pt-BR");
  const fmtMoney = n => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
  const fmtMoneyCompact = n => {
    if (n >= 1e6) return "R$ " + (n/1e6).toFixed(1).replace(".", ",") + "M";
    if (n >= 1e3) return "R$ " + (n/1e3).toFixed(1).replace(".", ",") + "K";
    return fmtMoney(n);
  };
  const fmtCompact = n => {
    if (n >= 1e6) return (n/1e6).toFixed(1).replace(".", ",") + "M";
    if (n >= 1e3) return (n/1e3).toFixed(1).replace(".", ",") + "K";
    return fmtInt(n);
  };
  const fmtPct = n => (n*100).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + "%";
  const fmtRoi = n => (isFinite(n) ? (n >= 0 ? "+" : "") + (n*100).toLocaleString("pt-BR", { maximumFractionDigits: 0 }) + "%" : "—");
  const rand = (a,b) => a + Math.random() * (b-a);
  const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const dateStr = d => d.toISOString().slice(0,10);

  // ---------- state ----------
  let rawRows = [];          // full 30-day dataset (Meta Ads via Windsor.ai)
  let rawContracts = [];     // full 30-day dataset (contratos fechados, manual)
  let dataMode = "demo";       // demo | live
  let contractsMode = "demo";  // demo | live
  // Lista de campanhas é montada a partir dos dados que chegam (mock ou reais)
  // — nunca hardcoded, porque campanhas reais do Meta Ads têm nomes que a
  // gente não controla (ex.: "AA_JUNHO_CBO_BROAD").
  let campaigns = [];        // [{name, color}]
  let campaignsInitialized = false;
  let activeCampaigns = new Set();
  const CAMPAIGN_COLOR_SLOTS = ["--series-1","--series-2","--series-3","--series-4","--series-5","--series-6"];
  function campColorVar(name) { return (campaigns.find(c => c.name === name) || {}).color || "--series-1"; }
  function updateCampaigns(rows) {
    const names = Array.from(new Set(rows.map(r => r.campaign).filter(Boolean))).sort();
    const prevColor = new Map(campaigns.map(c => [c.name, c.color]));
    const prevNames = new Set(campaigns.map(c => c.name));
    campaigns = names.map((name, i) => ({ name, color: prevColor.get(name) || CAMPAIGN_COLOR_SLOTS[i % CAMPAIGN_COLOR_SLOTS.length] }));
    if (!campaignsInitialized) {
      activeCampaigns = new Set(names);
      campaignsInitialized = true;
    } else {
      names.forEach(n => { if (!prevNames.has(n)) activeCampaigns.add(n); }); // campanha nova entra ativada
    }
  }
  let rangeDays = 14;
  let searchTerm = "";
  let sortKey = "spend", sortDir = -1;
  let countdown = REFRESH_MS / 1000;

  // ---------- mock data ----------
  function generateMockData() {
    const rows = [];
    const today = new Date();
    for (let i = 29; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const weekday = d.getDay();
      const weekendDamp = (weekday === 0 || weekday === 6) ? 0.75 : 1;
      CAMPAIGN_DEFS.forEach(def => {
        const spend = rand(def.dailySpend[0], def.dailySpend[1]) * weekendDamp;
        const cpc = rand(def.cpc[0], def.cpc[1]);
        const clicks = spend / cpc;
        const leadRate = rand(def.leadRate[0], def.leadRate[1]);
        const leads = clicks * leadRate;
        rows.push({
          date: dateStr(d), channel: def.channel, campaign: def.name, status: def.status,
          spend, leads,
        });
      });
    }
    return rows;
  }

  // ~1 contrato fechado a cada 2-3 dias, valor perto do ticket médio (com
  // alguma variação e, às vezes, sem "valor" preenchido — pra testar o
  // fallback pro TICKET_MEDIO).
  function generateMockContracts() {
    const rows = [];
    const today = new Date();
    for (let i = 29; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      if (Math.random() < 0.55) {
        const hasValor = Math.random() < 0.75;
        rows.push({ date: dateStr(d), valor: hasValor ? Math.round(rand(TICKET_MEDIO*0.8, TICKET_MEDIO*1.3)) : null });
      }
    }
    return rows;
  }

  // ---------- CSV parsing for live source ----------
  // O Google Sheets sempre reformata data para o padrão local (DD/MM/AAAA),
  // não importa o que você digite — então o painel aceita os dois formatos
  // (ISO e brasileiro) em vez de depender de um formato fixo na planilha.
  function normalizeDate(str) {
    if (!str) return "";
    str = String(str).trim();
    if (/^\d{4}-\d{1,2}-\d{1,2}/.test(str)) {
      const [y, m, d] = str.slice(0, 10).split("-");
      return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
    }
    let m = str.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/); // DD/MM/AAAA ou DD-MM-AAAA
    if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
    const d = new Date(str);
    return isNaN(d.getTime()) ? str : dateStr(d);
  }
  // Aceita número puro, "R$6.000", "R$ 6.000,00" etc. — o que o Sheets
  // exportar quando a coluna estiver formatada como moeda.
  function parseMoney(str) {
    if (str == null || str === "") return NaN;
    let s = String(str).replace(/[^\d,.-]/g, "");
    if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
    else if (s.includes(",")) s = s.replace(",", ".");
    const thousands = s.match(/^(-?\d+)\.(\d{3})$/); // "6.000" sem casas decimais
    if (thousands) s = thousands[1] + thousands[2];
    return parseFloat(s);
  }

  // Conectores como o Windsor.ai nem sempre usam os nomes de coluna exatos
  // que a gente pediu (ex.: "campaign_status" em vez de "status",
  // "actions_lead" em vez de "leads") — então em vez de exigir que a
  // planilha bata certinho, o painel procura por qualquer um dos nomes
  // conhecidos pra cada campo.
  const normHeader = h => String(h).toLowerCase().replace(/[^a-z0-9]/g, "");
  const COLUMN_ALIASES = {
    date:     ["date"],
    channel:  ["channel", "datasource", "source"],
    campaign: ["campaign", "campaignname"],
    status:   ["status", "campaignstatus", "effectivestatus", "campaigneffectivestatus"],
    spend:    ["spend", "amount", "cost"],
    leads:    ["leads", "actionslead", "lead", "actionlead"],
  };
  function resolveColumns(headers) {
    const headerNorm = headers.map(normHeader);
    const cols = {};
    Object.entries(COLUMN_ALIASES).forEach(([field, aliases]) => {
      cols[field] = -1;
      for (const alias of aliases) {
        const idx = headerNorm.indexOf(normHeader(alias));
        if (idx !== -1) { cols[field] = idx; break; }
      }
    });
    return cols;
  }

  // O Google Sheets exporta números no formato do idioma da planilha — em
  // pt-BR isso é vírgula decimal (ex.: "45,78"), sem aspas em volta do
  // valor. Como o resto do arquivo é separado por vírgula, isso quebra a
  // célula em duas ("45" e "78") e desalinha todas as colunas seguintes.
  // Como sabemos de antemão quais colunas são monetárias, remontamos
  // especificamente essas posições antes de ler o resto da linha.
  // Parser de CSV "de verdade": respeita campos entre aspas (vírgula dentro
  // de aspas não é separador de coluna, e "" dentro de aspas vira um "
  // literal). O Google Sheets pode ou não colocar aspas em números com
  // vírgula decimal dependendo do caso — isso trata os dois jeitos certo,
  // em vez de tentar adivinhar.
  function splitCSVLine(line) {
    const cells = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQuotes) {
        if (ch === '"') {
          if (line[i + 1] === '"') { cur += '"'; i++; }
          else { inQuotes = false; }
        } else {
          cur += ch;
        }
      } else {
        if (ch === '"') { inQuotes = true; }
        else if (ch === ",") { cells.push(cur); cur = ""; }
        else { cur += ch; }
      }
    }
    cells.push(cur);
    return cells.map(c => c.trim());
  }

  // Camada extra de segurança para o caso (mais raro) de o número decimal
  // vir com vírgula E sem aspas — nesse caso nem o parser de aspas ajuda,
  // então remonta a coluna monetária manualmente.
  function fixDecimalCommaSplit(cells, headerCount, moneyIdxList) {
    let offset = 0;
    moneyIdxList.filter(i => i !== -1).sort((a,b) => a-b).forEach(origIdx => {
      const idx = origIdx + offset;
      while (
        cells.length > headerCount && idx >= 0 && idx + 1 < cells.length &&
        /^-?\d+(\.\d+)?$/.test(cells[idx]) && /^\d{1,2}$/.test(cells[idx + 1])
      ) {
        cells.splice(idx, 2, cells[idx] + "," + cells[idx + 1]);
        offset -= 1;
      }
    });
    return cells;
  }

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    const headers = splitCSVLine(lines[0]);
    const col = resolveColumns(headers);
    return lines.slice(1).filter(Boolean).map(line => {
      let cells = splitCSVLine(line);
      cells = fixDecimalCommaSplit(cells, headers.length, [col.spend]);
      const get = field => (col[field] !== -1 && cells[col[field]] != null ? cells[col[field]] : "");
      return {
        date: normalizeDate(get("date")), channel: get("channel") || "Meta Ads",
        campaign: get("campaign"), status: get("status") || "Ativa",
        spend: parseMoney(get("spend")) || 0, leads: parseMoney(get("leads")) || 0,
      };
    }).filter(r => {
      const s = r.status.toLowerCase();
      return s.startsWith("ativ") || s.startsWith("activ") || s === "on"; // pt-BR ou inglês
    });
  }

  function parseContractsCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    const headers = splitCSVLine(lines[0]).map(h => h.toLowerCase());
    const valorIdx = headers.indexOf("valor");
    return lines.slice(1).filter(Boolean).map(line => {
      let cells = splitCSVLine(line);
      cells = fixDecimalCommaSplit(cells, headers.length, [valorIdx]);
      const row = {};
      headers.forEach((h, idx) => row[h] = cells[idx] ? cells[idx].trim() : "");
      const valor = parseMoney(row.valor);
      return { date: normalizeDate(row.date), valor: isFinite(valor) && valor > 0 ? valor : null };
    });
  }

  async function fetchData() {
    if (DATA_SOURCE_URL) {
      try {
        const res = await fetch(DATA_SOURCE_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        const parsed = parseCSV(text);
        if (parsed.length) { dataMode = "live"; return parsed; }
        throw new Error("empty");
      } catch (e) {
        console.warn("Falha ao buscar DATA_SOURCE_URL, usando dados de exemplo:", e);
      }
    }
    dataMode = "demo";
    return generateMockData();
  }

  async function fetchContracts() {
    if (CONTRACTS_SOURCE_URL) {
      try {
        const res = await fetch(CONTRACTS_SOURCE_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        const parsed = parseContractsCSV(text);
        contractsMode = "live";
        return parsed; // uma planilha vazia (0 contratos no período) é um resultado válido
      } catch (e) {
        console.warn("Falha ao buscar CONTRACTS_SOURCE_URL, usando dados de exemplo:", e);
      }
    }
    contractsMode = "demo";
    return generateMockContracts();
  }

  // ---------- derived helpers ----------
  function filteredRows() {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - (rangeDays - 1));
    const cutoffStr = dateStr(cutoff);
    return rawRows.filter(r => activeCampaigns.has(r.campaign) && r.date >= cutoffStr);
  }
  function priorRows() {
    const end = new Date(); end.setDate(end.getDate() - rangeDays);
    const start = new Date(); start.setDate(start.getDate() - (rangeDays * 2 - 1));
    const endStr = dateStr(end), startStr = dateStr(start);
    return rawRows.filter(r => activeCampaigns.has(r.campaign) && r.date >= startStr && r.date <= endStr);
  }
  // Sem o filtro de campanha (chips) — usadas para os números gerais do
  // escritório (custo por aquisição / ROI), que não fazem sentido "por campanha".
  function filteredRowsAll() {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - (rangeDays - 1));
    const cutoffStr = dateStr(cutoff);
    return rawRows.filter(r => r.date >= cutoffStr);
  }
  function priorRowsAll() {
    const end = new Date(); end.setDate(end.getDate() - rangeDays);
    const start = new Date(); start.setDate(start.getDate() - (rangeDays * 2 - 1));
    const endStr = dateStr(end), startStr = dateStr(start);
    return rawRows.filter(r => r.date >= startStr && r.date <= endStr);
  }
  function filteredContracts() {
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - (rangeDays - 1));
    const cutoffStr = dateStr(cutoff);
    return rawContracts.filter(r => r.date >= cutoffStr);
  }
  function priorContracts() {
    const end = new Date(); end.setDate(end.getDate() - rangeDays);
    const start = new Date(); start.setDate(start.getDate() - (rangeDays * 2 - 1));
    const endStr = dateStr(end), startStr = dateStr(start);
    return rawContracts.filter(r => r.date >= startStr && r.date <= endStr);
  }
  function aggregate(rows) {
    const a = { spend: 0, leads: 0 };
    rows.forEach(r => { a.spend += r.spend; a.leads += r.leads; });
    a.cpl = a.leads ? a.spend / a.leads : NaN;
    return a;
  }
  function aggregateContracts(rows) {
    const count = rows.length;
    const revenue = rows.reduce((sum, r) => sum + (r.valor != null ? r.valor : TICKET_MEDIO), 0);
    return { count, revenue };
  }
  function byCampaign(rows) {
    const map = new Map();
    rows.forEach(r => {
      const key = r.channel + "|" + r.campaign;
      if (!map.has(key)) map.set(key, { channel: r.channel, campaign: r.campaign, status: r.status, spend:0, leads:0 });
      const c = map.get(key);
      c.spend += r.spend; c.leads += r.leads;
    });
    return Array.from(map.values()).map(c => ({
      ...c, cpl: c.leads ? c.spend / c.leads : NaN,
    }));
  }
  function byDayCampaign(rows) {
    const days = {};
    rows.forEach(r => {
      if (!days[r.date]) days[r.date] = {};
      days[r.date][r.campaign] = (days[r.date][r.campaign] || 0) + r.spend;
    });
    return Object.keys(days).sort().map(date => ({ date, values: days[date] }));
  }

  // ---------- render: chips ----------
  function renderChips() {
    const el = document.getElementById("campaignChips");
    el.innerHTML = "";
    campaigns.forEach(c => {
      const label = document.createElement("label");
      label.className = "chip";
      label.innerHTML = `<span class="swatch" style="background:var(${c.color})"></span>${c.name}`;
      const input = document.createElement("input");
      input.type = "checkbox"; input.checked = activeCampaigns.has(c.name);
      input.addEventListener("change", () => {
        if (input.checked) activeCampaigns.add(c.name); else activeCampaigns.delete(c.name);
        renderAll();
      });
      label.prepend(input);
      el.appendChild(label);
    });
  }

  // ---------- render: KPI ----------
  function delta(curr, prev) {
    if (!isFinite(prev) || prev === 0) return null;
    return (curr - prev) / prev;
  }
  function sparkPath(values, w, h) {
    if (values.length < 2) return "";
    const max = Math.max(...values, 0.0001), min = Math.min(...values, 0);
    const span = (max - min) || 1;
    return values.map((v, i) => {
      const x = (i / (values.length - 1)) * w;
      const y = h - ((v - min) / span) * h;
      return (i === 0 ? "M" : "L") + x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
  }
  function renderKPIs() {
    const cur = aggregate(filteredRows());
    const prev = aggregate(priorRows());
    const daily = byDayCampaign(filteredRows());
    const spendSeries = daily.map(d => Object.values(d.values).reduce((a,b) => a+b, 0));

    // Números gerais do escritório: investimento TOTAL (todas as campanhas,
    // sem o filtro de chips) cruzado com contratos fechados (fonte manual).
    const curAll = aggregate(filteredRowsAll());
    const prevAll = aggregate(priorRowsAll());
    const curC = aggregateContracts(filteredContracts());
    const prevC = aggregateContracts(priorContracts());
    const cpaCur = curC.count ? curAll.spend / curC.count : NaN;
    const cpaPrev = prevC.count ? prevAll.spend / prevC.count : NaN;
    const roiCur = curAll.spend ? (curC.revenue - curAll.spend) / curAll.spend : NaN;
    const roiPrev = prevAll.spend ? (prevC.revenue - prevAll.spend) / prevAll.spend : NaN;

    const tiles = [
      { label: "Investido", value: fmtMoneyCompact(cur.spend), d: delta(cur.spend, prev.spend), up: false, spark: spendSeries },
      { label: "Leads", value: fmtCompact(cur.leads), d: delta(cur.leads, prev.leads), up: true },
      { label: "CPL médio", value: isFinite(cur.cpl) ? fmtMoney(cur.cpl) : "—", d: delta(cur.cpl, prev.cpl), up: false },
      { label: "Contratos fechados", value: fmtCompact(curC.count), d: delta(curC.count, prevC.count), up: true },
      { label: "Custo por aquisição", value: isFinite(cpaCur) ? fmtMoney(cpaCur) : "—", d: delta(cpaCur, cpaPrev), up: false },
      { label: "ROI médio", value: fmtRoi(roiCur), d: delta(roiCur, roiPrev), up: true },
    ];
    const row = document.getElementById("kpiRow");
    row.innerHTML = "";
    tiles.forEach(t => {
      const div = document.createElement("div");
      div.className = "stat-tile";
      let deltaHtml = "";
      if (t.d !== null && isFinite(t.d)) {
        const good = t.up ? t.d >= 0 : t.d < 0;
        const arrow = t.d >= 0 ? "▲" : "▼";
        deltaHtml = `<div class="delta ${good ? "up" : "down"}">${arrow} ${Math.abs(t.d*100).toFixed(1)}%<span class="vs">vs período anterior</span></div>`;
      }
      let sparkHtml = "";
      if (t.spark && t.spark.length > 1) {
        const w = 140, h = 28;
        sparkHtml = `<svg class="spark" width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <path d="${sparkPath(t.spark, w, h)}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
      }
      div.innerHTML = `<div class="label">${t.label}</div><div class="value">${t.value}</div>${deltaHtml}${sparkHtml}`;
      row.appendChild(div);
    });
  }

  // ---------- render: line chart ----------
  function renderLineChart() {
    const svg = document.getElementById("lineChart");
    const legend = document.getElementById("lineLegend");
    const tooltip = document.getElementById("lineTooltip");
    const W = 640, H = 260, PAD_L = 46, PAD_B = 26, PAD_T = 10, PAD_R = 10;
    const plotW = W - PAD_L - PAD_R, plotH = H - PAD_T - PAD_B;

    const daily = byDayCampaign(filteredRows());
    const activeList = campaigns.filter(c => activeCampaigns.has(c.name)).map(c => ({ id: c.name, var: c.color }));
    const maxVal = Math.max(1, ...daily.map(d => Math.max(0, ...activeList.map(c => d.values[c.id] || 0))));
    const niceMax = Math.ceil(maxVal / 500) * 500 || 500;

    const x = i => PAD_L + (daily.length <= 1 ? 0 : (i / (daily.length - 1)) * plotW);
    const y = v => PAD_T + plotH - (v / niceMax) * plotH;

    let svgParts = "";
    // gridlines (4 steps)
    for (let g = 0; g <= 4; g++) {
      const gv = (niceMax / 4) * g;
      const gy = y(gv);
      svgParts += `<line x1="${PAD_L}" y1="${gy}" x2="${W-PAD_R}" y2="${gy}" stroke="var(--grid)" stroke-width="1"/>`;
      svgParts += `<text x="${PAD_L-8}" y="${gy+3}" text-anchor="end" font-size="9" fill="var(--text-muted)">${fmtCompact(gv)}</text>`;
    }
    // x labels (sparse)
    const step = Math.max(1, Math.floor(daily.length / 6));
    daily.forEach((d, i) => {
      if (i % step === 0 || i === daily.length - 1) {
        const dt = new Date(d.date + "T00:00:00");
        svgParts += `<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${dt.getDate()}/${dt.getMonth()+1}</text>`;
      }
    });
    // lines
    activeList.forEach(c => {
      const pts = daily.map((d,i) => [x(i), y(d.values[c.id] || 0)]);
      const path = pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
      svgParts += `<path d="${path}" fill="none" stroke="var(${c.var})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
      const last = pts[pts.length - 1];
      if (last) svgParts += `<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(${c.var})" stroke="var(--surface-1)" stroke-width="2"/>`;
    });
    // hover capture layer
    svgParts += `<rect id="lineHover" x="${PAD_L}" y="${PAD_T}" width="${plotW}" height="${plotH}" fill="transparent"/>`;
    svg.innerHTML = svgParts;

    // legend (click to isolate/toggle) — a single series names itself in the
    // card title already, so the legend box only earns its place at 2+ series.
    legend.innerHTML = "";
    legend.style.display = campaigns.length > 1 ? "flex" : "none";
    campaigns.forEach(c => {
      const item = document.createElement("div");
      item.className = "item" + (activeCampaigns.has(c.name) ? "" : " off");
      item.innerHTML = `<span class="swatch" style="background:var(${c.color})"></span>${c.name}`;
      item.addEventListener("click", () => {
        if (activeCampaigns.has(c.name)) activeCampaigns.delete(c.name); else activeCampaigns.add(c.name);
        renderAll();
      });
      legend.appendChild(item);
    });

    // crosshair tooltip
    const hoverRect = svg.querySelector("#lineHover");
    if (hoverRect) {
      hoverRect.addEventListener("mousemove", (e) => {
        const bbox = svg.getBoundingClientRect();
        const relX = ((e.clientX - bbox.left) / bbox.width) * W;
        let idx = Math.round(((relX - PAD_L) / plotW) * (daily.length - 1));
        idx = Math.max(0, Math.min(daily.length - 1, idx));
        const d = daily[idx];
        if (!d) return;
        const dt = new Date(d.date + "T00:00:00");
        let rows = activeList.map(c => `<div class="t-row"><span class="t-dot" style="background:var(${c.var})"></span>${c.id}: ${fmtMoneyCompact(d.values[c.id] || 0)}</div>`).join("");
        tooltip.innerHTML = `<strong>${dt.getDate()}/${dt.getMonth()+1}</strong>${rows}`;
        tooltip.style.left = (x(idx) / W) * 100 + "%";
        tooltip.style.top = "10px";
        tooltip.classList.add("show");
      });
      hoverRect.addEventListener("mouseleave", () => tooltip.classList.remove("show"));
    }

    // table view twin
    const table = document.getElementById("lineTable");
    let thead = "<thead><tr><th>Data</th>" + activeList.map(c => `<th>${c.id}</th>`).join("") + "</tr></thead>";
    let tbody = "<tbody>" + daily.map(d => {
      const dt = new Date(d.date + "T00:00:00");
      return `<tr><td>${dt.getDate()}/${dt.getMonth()+1}</td>` + activeList.map(c => `<td>${fmtMoney(d.values[c.id] || 0)}</td>`).join("") + "</tr>";
    }).join("") + "</tbody>";
    table.innerHTML = thead + tbody;
  }

  // ---------- render: bar chart (CPL by campaign, lowest = melhor) ----------
  function renderBarChart() {
    const svg = document.getElementById("barChart");
    const tooltip = document.getElementById("barTooltip");
    const data = byCampaign(filteredRows())
      .filter(c => isFinite(c.cpl))
      .sort((a,b) => a.cpl - b.cpl)
      .slice(0, 8);

    const W = 400, H = 260, PAD_L = 118, PAD_R = 34, PAD_T = 8, PAD_B = 8;
    const plotW = W - PAD_L - PAD_R;
    const barH = 18, gap = (H - PAD_T - PAD_B) / data.length;
    const maxVal = Math.max(0.1, ...data.map(d => d.cpl));
    const niceMax = Math.ceil(maxVal * 1.15);
    const xScale = v => (v / niceMax) * plotW;

    let parts = "";
    // gridlines
    for (let g = 0; g <= 4; g++) {
      const gv = (niceMax / 4) * g;
      const gx = PAD_L + xScale(gv);
      parts += `<line x1="${gx}" y1="${PAD_T}" x2="${gx}" y2="${H-PAD_B}" stroke="var(--grid)" stroke-width="1"/>`;
      parts += `<text x="${gx}" y="${H-1}" text-anchor="middle" font-size="8.5" fill="var(--text-muted)">R$${gv.toFixed(0)}</text>`;
    }
    data.forEach((d, i) => {
      const cy = PAD_T + i * gap + gap/2;
      const w = Math.max(2, xScale(d.cpl));
      parts += `<text x="${PAD_L - 8}" y="${cy+3}" text-anchor="end" font-size="10" fill="var(--text-secondary)">${d.campaign.length > 16 ? d.campaign.slice(0,15)+"…" : d.campaign}</text>`;
      parts += `<rect class="bar-mark" data-idx="${i}" x="${PAD_L}" y="${cy - barH/2}" width="${w}" height="${barH}" rx="4" fill="var(${campColorVar(d.campaign)})"/>`;
      parts += `<text x="${PAD_L + w + 6}" y="${cy+3}" font-size="10" fill="var(--text-primary)" font-weight="600">${fmtMoney(d.cpl)}</text>`;
    });
    svg.innerHTML = parts;

    svg.querySelectorAll(".bar-mark").forEach(rect => {
      rect.addEventListener("mousemove", (e) => {
        const idx = +rect.dataset.idx;
        const d = data[idx];
        const bbox = svg.getBoundingClientRect();
        const relX = ((e.clientX - bbox.left) / bbox.width) * 100;
        tooltip.innerHTML = `<strong>${d.campaign}</strong>
          <div>CPL: ${fmtMoney(d.cpl)}</div><div>Investido: ${fmtMoney(d.spend)}</div><div>Leads: ${fmtInt(d.leads)}</div>`;
        tooltip.style.left = relX + "%";
        tooltip.style.top = "6px";
        tooltip.classList.add("show");
      });
      rect.addEventListener("mouseleave", () => tooltip.classList.remove("show"));
    });

    const table = document.getElementById("barTable");
    table.innerHTML = "<thead><tr><th>Campanha</th><th>CPL</th><th>Investido</th><th>Leads</th></tr></thead><tbody>" +
      data.map(d => `<tr><td>${d.campaign}</td><td>${fmtMoney(d.cpl)}</td><td>${fmtMoney(d.spend)}</td><td>${fmtInt(d.leads)}</td></tr>`).join("") +
      "</tbody>";
  }

  // ---------- render: main table ----------
  function renderMainTable() {
    let rows = byCampaign(filteredRows());
    if (searchTerm) rows = rows.filter(r => r.campaign.toLowerCase().includes(searchTerm));
    rows.sort((a,b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (typeof av === "string") return sortDir * av.localeCompare(bv);
      return sortDir * ((isFinite(av)?av:-Infinity) - (isFinite(bv)?bv:-Infinity));
    });
    const body = document.getElementById("mainTableBody");
    body.innerHTML = rows.map(r => {
      return `<tr>
        <td>${r.campaign}</td>
        <td><span class="chan-tag"><span class="swatch" style="background:var(--status-good)"></span>${r.status}</span></td>
        <td class="num">${fmtMoney(r.spend)}</td>
        <td class="num">${fmtInt(r.leads)}</td>
        <td class="num">${isFinite(r.cpl) ? fmtMoney(r.cpl) : "—"}</td>
      </tr>`;
    }).join("");

    document.querySelectorAll("#mainTable th").forEach(th => {
      th.classList.toggle("sorted", th.dataset.key === sortKey);
      th.dataset.arrow = sortDir === 1 ? "↑" : "↓";
    });
  }

  // ---------- render all ----------
  function renderAll() {
    renderChips();
    renderKPIs();
    renderLineChart();
    renderBarChart();
    renderMainTable();
    document.getElementById("subtitle").textContent =
      `Meta Ads · ${rangeDays} dias · ${activeCampaigns.size} de ${campaigns.length} campanhas`;
  }

  // ---------- refresh cycle ----------
  async function refresh() {
    document.getElementById("statusText").textContent = "Atualizando…";
    [rawRows, rawContracts] = await Promise.all([fetchData(), fetchContracts()]);
    updateCampaigns(rawRows);

    const pill = document.getElementById("statusPill");
    pill.className = "pill " + (dataMode === "live" ? "live" : "demo");
    document.getElementById("statusText").textContent = dataMode === "live" ? "Meta Ads: ao vivo" : "Meta Ads: exemplo";

    const cPill = document.getElementById("contractsPill");
    cPill.className = "pill " + (contractsMode === "live" ? "live" : "demo");
    document.getElementById("contractsText").textContent = contractsMode === "live" ? "Contratos: ao vivo" : "Contratos: exemplo";

    document.getElementById("updatedText").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR");
    renderAll();
    countdown = REFRESH_MS / 1000;
  }

  function tickCountdown() {
    countdown -= 1;
    if (countdown <= 0) { refresh(); return; }
    const pct = 100 - (countdown / (REFRESH_MS/1000)) * 100;
    document.getElementById("progressFill").style.width = pct + "%";
  }

  // ---------- wiring ----------
  document.getElementById("refreshBtn").addEventListener("click", refresh);
  document.getElementById("themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    const current = root.getAttribute("data-theme");
    root.setAttribute("data-theme", current === "dark" ? "light" : "dark");
    renderAll();
  });
  document.getElementById("rangeSelect").addEventListener("change", (e) => {
    rangeDays = +e.target.value; renderAll();
  });
  document.getElementById("searchInput").addEventListener("input", (e) => {
    searchTerm = e.target.value.trim().toLowerCase(); renderMainTable();
  });
  document.querySelectorAll("#mainTable th").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
      renderMainTable();
    });
  });
  document.querySelectorAll("[data-toggle-table]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.toggleTable;
      const wrap = document.getElementById(id + "Wrap");
      const table = document.getElementById(id.replace("Chart","Table"));
      const showingTable = table.classList.toggle("show");
      wrap.classList.toggle("table-mode", showingTable);
      btn.textContent = showingTable ? "Ver gráfico" : "Ver tabela";
    });
  });

  // system theme default
  if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
    document.documentElement.setAttribute("data-theme", "dark");
  }

  refresh();
  setInterval(tickCountdown, 1000);
})();
</script>
</body>
</html>
